[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soiltrust"
version = "0.2.0"
description = "A reliability layer for soil intelligence: provenance, deterministic quality checks, uncertainty, and abstention before AI explanation."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Sean Liu"}]
dependencies = []

[project.scripts]
soiltrust = "soiltrust.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
