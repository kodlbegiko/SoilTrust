name: SoilTrust research demo checks

on:
  push:
    branches:
      - feat/soiltrust-v0.3-streamlit-demo
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install demo and existing soiltrust package
        run: python -m pip install -r requirements.txt
      - name: Run original and new unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python source compiles
        run: python -m compileall -q streamlit_app.py src/soiltrust
